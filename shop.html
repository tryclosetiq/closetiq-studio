<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<meta property="og:title" content="Shop this outfit · ClosetIQ Studio">
<meta property="og:description" content="Every piece in this look, with links.">
<meta property="og:type" content="website">
<title>Shop This Outfit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
  :root{--bg:#f5efe6;--card:#fffcf7;--ink:#1c1915;--muted:#70675c;--line:#e5dbcc;--soft:#efe6d9;--accent:#a8894f;--accent-ink:#fffaf0}
  @media (prefers-color-scheme: dark){:root:not([data-theme=light]){--bg:#15120e;--card:#1f1a14;--ink:#f3ede4;--muted:#a79d90;--line:#352e26;--soft:#2a241c;--accent:#cfb27a;--accent-ink:#1c1915}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Inter Tight",system-ui,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  .brand{font:600 14px/1 Fraunces,serif;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px}
  h1{font:600 30px/1.1 Fraunces,serif;margin:0 0 6px;text-wrap:balance}
  .cap{color:var(--muted);white-space:pre-wrap;margin:0 0 16px;font-size:15px}
  .hero{width:100%;border-radius:16px;display:block;background:var(--soft);margin-bottom:18px}
  .herowrap{position:relative;margin-bottom:18px} .herowrap .hero{margin:0}
  .herowrap .hot{position:absolute;display:block;border-radius:8px;-webkit-tap-highlight-color:rgba(0,0,0,.08)} .herowrap .hot:focus-visible{outline:2px solid var(--accent)}
  .item .img a{display:block;width:100%;height:100%}
  .disc{font-size:13px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 16px}
  .item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
  .item .img{flex:0 0 84px;width:84px;height:104px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px}
  .item img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
  .item .t{flex:1;min-width:0}
  .item .n{font-weight:600;margin:0 0 2px}
  .item .b{color:var(--muted);font-size:13px;margin:0 0 8px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;font-size:14px}
  .btn[aria-disabled=true]{opacity:.5;pointer-events:none}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:22px}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  /* homepage grid */
  .home-head{text-align:center;padding:6px 0 14px} .home-head .logo{font:600 34px/1 Fraunces,serif;letter-spacing:-.01em;margin:0} .home-head .tag{color:var(--muted);margin:6px 0 0;font-size:15px}
  .store{display:flex;justify-content:center;margin:14px 0 4px} .store .btn{width:100%;max-width:360px;padding:13px 16px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch} .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px "Inter Tight",sans-serif;cursor:pointer} .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px} @media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
  .card .cv{aspect-ratio:4/5;width:100%;object-fit:cover;display:block;background:var(--soft)} .card .ct{padding:10px 12px 12px} .card .ti{font-weight:600;font-size:15px;line-height:1.25;margin:0} .card .cat{color:var(--muted);font-size:12px;margin:4px 0 0}
  .card .feat{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;padding:4px 8px;border-radius:999px}
  .back{display:inline-block;margin:0 0 12px;color:var(--muted);text-decoration:none;font-size:14px}
  /* storefront sections */
  .sections{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:4px 0 8px}
  .sec{display:block;text-align:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;font:600 15px/1.2 "Inter Tight",sans-serif}
  .sec.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .view{margin-top:6px} .h2{font:600 22px/1.2 Fraunces,serif;margin:18px 0 10px}
  .card.prod .ct{padding-bottom:12px} .shopbtn{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px}
  .about{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px} .about p{color:var(--muted);line-height:1.55;margin:0 0 14px}
  .about .btn{width:100%}
</style>
</head>
<body>
<div class="wrap" id="page"><div class="empty">Loading…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async () => {
  // Public page: reads ONLY published snapshots via the anon key (RLS: published = true). No login, no private data.
  const SUPABASE_URL = "https://yjjdzugecimjwgwtkwyw.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqamR6dWdlY2ltandnd3Rrd3l3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NjU5ODUsImV4cCI6MjEwNzM0MTk4NX0.Q0Is204-0M28vMwA9TGW8UJz_R4SJRNAmVunxSCyXko";
  const sb = supabase.createClient(SUPABASE_URL, ANON_KEY, { auth: { persistSession: false } });
  const pub = (p) => `${SUPABASE_URL}/storage/v1/object/public/shop/${p}`;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const page = document.getElementById("page");
  const qs = new URLSearchParams(location.search), slug = qs.get("o") || "";
  // Opened from the Studio (new tab or the phone's home-screen app): offer a way back. Inside the Studio's own preview
  // frame (embed=1) the Studio shows its own Back button, so none is added here.
  if (qs.get("from") === "studio" && qs.get("embed") !== "1") {
    const studio = location.href.replace(/shop\.html.*$/, "");
    const bar = document.createElement("div"); bar.style.cssText = "position:sticky;top:0;z-index:5;padding:8px 0 10px;background:var(--bg)";
    bar.innerHTML = `<a href="${esc(studio)}" class="btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">‹ Back to Studio</a>`;
    bar.querySelector("a").addEventListener("click", (e) => { if (history.length > 1 && document.referrer && document.referrer.startsWith(location.origin)) { e.preventDefault(); history.back(); } });
    page.parentNode.insertBefore(bar, page);
  }
  const ok = (u) => /^https:\/\/([a-z0-9-]+\.)*(amazon\.[a-z.]+|amzn\.(to|com|eu|asia|in)|a\.co)\//i.test(u || "");
  const home = location.pathname.split("/").pop() || "shop.html";
  // ---------------------------------------------------------------- homepage (no outfit in the address): grid of published outfits
  if (!slug) {
    // Storefront: four sections (Complete Looks, Individual Finds, My Favorites, Meet ClosetIQ) switched in place, so
    // visitors stay here and only leave when they choose an Amazon link. Everything shown is a published snapshot.
    let { data: rows, error } = await sb.from("shop_pages").select("slug,title,category,featured,listed,sort_order,cover_public_path,collage_public_path,storefront_url,disclosure,updated_at").eq("published", true);
    if (error) ({ data: rows } = await sb.from("shop_pages").select("slug,title,collage_public_path,disclosure,updated_at").eq("published", true));   // before the homepage columns exist
    rows = (rows || []).filter((r) => r.listed !== false && (r.cover_public_path || r.collage_public_path)).sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));   // newest first
    const { data: prodRows } = await sb.from("shop_products").select("id,name,brand,category,url,image_public_path,featured,sort_order,updated_at").eq("published", true);
    const products = (prodRows || []).filter((p) => p.image_public_path && ok(p.url)).sort((a, b) => ((b.featured ? 1 : 0) - (a.featured ? 1 : 0)) || ((a.sort_order ?? 0) - (b.sort_order ?? 0)) || (new Date(b.updated_at) - new Date(a.updated_at)));
    const { data: siteRow } = await sb.from("shop_site").select("title,subtitle,about_title,about_text,app_store_url,storefront_url,disclosure").limit(1).maybeSingle();
    const site = { title: "Shop My Style", subtitle: "Outfits, favorite finds & everyday inspiration.", about_title: "Meet ClosetIQ", ...(siteRow || {}) };
    const store = ok(site.storefront_url) ? site.storefront_url : (rows.map((r) => r.storefront_url).find(ok) || "");
    const appUrl = /^https:\/\/apps\.apple\.com\//i.test(site.app_store_url || "") ? site.app_store_url : "";
    const disclosure = site.disclosure || (rows[0] && rows[0].disclosure) || "As an Amazon Associate I earn from qualifying purchases.";
    document.title = site.title + " · ClosetIQ";
    const CATS = [["tops", "Tops"], ["bottoms", "Bottoms"], ["dresses", "Dresses & One-Pieces"], ["shoes", "Shoes"], ["handbags", "Handbags"], ["accessories", "Accessories"]];
    const catName = (k) => (CATS.find(([c]) => c === k) || [k, k])[1];
    const outfitCard = (r) => `<a class="card" href="${home}?o=${encodeURIComponent(r.slug)}" data-cat="${esc(r.category || "")}">${r.featured ? '<span class="feat">Favorite</span>' : ""}<img class="cv" src="${pub(r.cover_public_path || r.collage_public_path)}?v=${encodeURIComponent(r.updated_at)}" alt="${esc(r.title)}" loading="lazy"><div class="ct"><p class="ti">${esc(r.title)}</p>${r.category ? `<p class="cat">${esc(r.category)}</p>` : ""}</div></a>`;
    const productCard = (p) => `<a class="card prod" href="${esc(p.url)}" target="_blank" rel="noopener sponsored" data-cat="${esc(p.category)}">${p.featured ? '<span class="feat">Favorite</span>' : ""}<img class="cv" src="${pub(p.image_public_path)}?v=${encodeURIComponent(p.updated_at)}" alt="${esc(p.name)}" loading="lazy"><div class="ct"><p class="ti">${esc(p.name)}</p>${p.brand ? `<p class="cat">${esc(p.brand)}</p>` : ""}<span class="shopbtn">Shop on Amazon</span></div></a>`;
    const outfitCats = [...new Set(rows.map((r) => (r.category || "").trim()).filter(Boolean))];
    const prodCats = CATS.filter(([k]) => products.some((p) => p.category === k));
    const favOutfits = rows.filter((r) => r.featured), favProducts = products.filter((p) => p.featured);
    const nav = (cur) => `<div class="sections">${[["looks", "Shop Complete Looks"], ["finds", "Shop Individual Finds"], ["favorites", "My Favorites"], ["about", site.about_title || "Meet ClosetIQ"]].map(([k, l]) => `<a class="sec ${cur === k ? "on" : ""}" href="#${k}" data-sec="${k}">${esc(l)}</a>`).join("")}</div>`;
    const views = {
      looks: () => `${outfitCats.length ? `<div class="chips" data-chips="looks"><button class="chip on" data-c="">All looks</button>${outfitCats.map((c) => `<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
        ${rows.length ? `<div class="grid" data-grid="looks">${rows.map(outfitCard).join("")}</div>` : '<div class="empty">New looks are on the way — check back soon.</div>'}`,
      finds: () => `${prodCats.length ? `<div class="chips" data-chips="finds"><button class="chip on" data-c="">All finds</button>${prodCats.map(([k, l]) => `<button class="chip" data-c="${k}">${esc(l)}</button>`).join("")}</div>` : ""}
        ${products.length ? `<div class="grid" data-grid="finds">${products.map(productCard).join("")}</div>` : '<div class="empty">Favorite finds are coming soon.</div>'}`,
      favorites: () => (favOutfits.length || favProducts.length) ? `${favOutfits.length ? `<h2 class="h2">Favorite looks</h2><div class="grid">${favOutfits.map(outfitCard).join("")}</div>` : ""}${favProducts.length ? `<h2 class="h2">Favorite finds</h2><div class="grid">${favProducts.map(productCard).join("")}</div>` : ""}` : '<div class="empty">Nothing saved as a favorite yet.</div>',
      about: () => `<div class="about"><h2 class="h2" style="margin-top:0">${esc(site.about_title || "Meet ClosetIQ")}</h2>${site.about_text ? `<p>${esc(site.about_text)}</p>` : '<p>ClosetIQ is a separate AI wardrobe and personal styling app that helps you organize your closet, create outfits from clothes you already own, and discover personalized styling ideas.</p>'}${appUrl ? `<a class="btn" href="${esc(appUrl)}" target="_blank" rel="noopener">Get ClosetIQ on the App Store</a>` : ""}</div>`,
    };
    const render = () => {
      const cur = ["looks", "finds", "favorites", "about"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "looks";
      page.innerHTML = `<div class="home-head"><p class="brand">ClosetIQ</p><h1 class="logo">${esc(site.title)}</h1>${site.subtitle ? `<p class="tag">${esc(site.subtitle)}</p>` : ""}</div>
        ${nav(cur)}<div class="view">${views[cur]()}</div>
        ${store ? `<div class="store"><a class="btn" href="${esc(store)}" target="_blank" rel="noopener sponsored">Visit my Amazon Storefront</a></div>` : ""}
        <p class="disc" style="margin-top:18px">${esc(disclosure)}</p>`;
      page.querySelectorAll("[data-chips]").forEach((chips) => chips.querySelectorAll(".chip").forEach((b) => b.onclick = () => { chips.querySelectorAll(".chip").forEach((k) => k.classList.toggle("on", k === b)); const grid = page.querySelector(`[data-grid="${chips.dataset.chips}"]`); if (grid) grid.querySelectorAll(".card").forEach((c) => { c.style.display = !b.dataset.c || c.dataset.cat === b.dataset.c ? "" : "none"; }); }));
      window.scrollTo(0, 0);
    };
    window.addEventListener("hashchange", render); render();
    return;
  }
  const { data: p } = await sb.from("shop_pages").select("title,caption,disclosure,collage_public_path,items,updated_at").eq("slug", slug).eq("published", true).maybeSingle();
  if (!p) { page.innerHTML = `<div class="empty"><p class="brand">ClosetIQ Studio</p>This outfit is no longer available.<br><br><a class="btn" href="${home}">See all outfits</a></div>`; return; }
  document.title = p.title + " · Shop This Outfit";
  // Short, clean product name (first clause; if still long, first three words + the final word). Display only.
  const GARMENT_NOUNS = /^(sweatshirts?|sweaters?|hoodies?|cardigans?|tops?|tees?|t-shirts?|shirts?|blouses?|tanks?|bodysuits?|jackets?|coats?|blazers?|vests?|leggings|pants|trousers|jeans|joggers|shorts|skirts?|dress(es)?|rompers?|jumpsuits?|sneakers?|boots?|heels|sandals|loafers|flats|mules|shoes?|socks?|bags?|totes?|purses?|clutch(es)?|backpacks?|belts?|scarf|scarves|hats?|caps?|beanies?|earrings?|necklaces?|bracelets?|rings?|watch(es)?|sunglasses|glasses|sets?|mini|midi|maxi)$/i;
  const shortName = (name) => { let s = String(name || "").trim().replace(/\s+/g, " "); s = s.split(/\s*[,;|(]\s*|\s[-–—]\s|\s+(?:that|with|for|featuring|in a|in an)\s+/i)[0].trim().replace(/[.\s]+$/, ""); let w = s.split(" ").filter(Boolean); let last = -1; w.forEach((x, i) => { if (GARMENT_NOUNS.test(x.replace(/[^a-z-]/gi, ""))) last = i; }); if (last >= 0) w = w.slice(0, last + 1); if (w.join(" ").length > 40 && w.length > 4) w = [...w.slice(0, 3), w[w.length - 1]]; s = w.join(" "); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; };
  // Real products only: a saved name (not a category placeholder like "Tops" or "Accessory"). A public photo is optional —
  // a name and a link still show, with no thumbnail. custom.jpg is an owner upload, so collage hotspots are not drawn on it.
  const placeholder = /^(tops?|bottoms?|shoes?|accessor(y|ies)|dress(es)?|outerwear|bags?|jewel(le)?ry|item|one-pieces?|accessory)$/i;
  const customHero = /\/custom\.jpg$/i.test(p.collage_public_path || "");
  const items = (p.items || []).filter((it) => it && String(it.name || "").trim() && !placeholder.test(String(it.name).trim())).map((it) => ({ ...it, name: shortName(it.name) }));
  p.items = items;
  page.innerHTML = `<a class="back" href="${home}${qs.get("from") === "studio" ? "?from=studio" + (qs.get("embed") === "1" ? "&embed=1" : "") : ""}#looks">‹ All looks</a><p class="brand">Shop this look</p><h1>${esc(p.title)}</h1>${p.caption ? `<p class="cap">${esc(p.caption)}</p>` : ""}
    ${p.collage_public_path ? `<div class="herowrap"><img class="hero" src="${pub(p.collage_public_path)}?v=${encodeURIComponent(p.updated_at || "")}" alt="${esc(p.title)}">${customHero ? "" : (p.items || []).filter((it) => it.hotspot && ok(it.url)).map((it) => `<a class="hot" href="${esc(it.url)}" target="_blank" rel="noopener sponsored" aria-label="Shop ${esc(it.name)} on Amazon" style="left:${(it.hotspot.x * 100).toFixed(2)}%;top:${(it.hotspot.y * 100).toFixed(2)}%;width:${(it.hotspot.w * 100).toFixed(2)}%;height:${(it.hotspot.h * 100).toFixed(2)}%"></a>`).join("")}</div>` : ""}
    <p class="disc">${esc(p.disclosure)}</p>
    ${(p.items || []).map((it) => { const fresh = it.price && it.price_at && Date.now() - new Date(it.price_at).getTime() < 24 * 3600e3;
      const img = it.image_path ? `<img src="${pub(it.image_path)}" alt="${esc(it.name)}" loading="lazy">` : it.image_url ? `<img src="${esc(it.image_url)}" alt="${esc(it.name)}" loading="lazy">` : "";
      const thumb = img ? `<div class="img">${ok(it.url) ? `<a href="${esc(it.url)}" target="_blank" rel="noopener sponsored" aria-label="Shop ${esc(it.name)} on Amazon">${img}</a>` : img}</div>` : "";
      return `<div class="item">${thumb}
      <div class="t"><p class="n">${esc(it.name)}</p>${it.brand ? `<p class="b">${esc(it.brand)}</p>` : ""}${fresh ? `<p class="b">${esc(it.price)} <span style="font-size:11px">as of ${esc(new Date(it.price_at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}</span></p>` : ""}
        <a class="btn" href="${ok(it.url) ? esc(it.url) : "#"}" ${ok(it.url) ? 'target="_blank" rel="noopener sponsored"' : 'aria-disabled="true"'}>${ok(it.url) ? "Shop on Amazon" : "Link coming soon"}</a></div></div>`; }).join("")}
    <p class="foot">Prices and availability are shown on Amazon. Updated ${esc(new Date(p.updated_at).toLocaleDateString())}.</p>`;
})();
</script>
</body>
</html>
